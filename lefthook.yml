pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{ts,tsx}'
      run: bunx oxlint {staged_files}
    format-ts:
      glob: '*.{ts,tsx,css}'
      run: bunx oxfmt {staged_files}
      stage_fixed: true
    format-astro:
      glob: '*.astro'
      run: bunx prettier --write {staged_files}
      stage_fixed: true
    test:
      glob: '*.{ts,tsx}'
      run: bun test

pre-push:
  commands:
    typecheck:
      run: bun run typecheck
