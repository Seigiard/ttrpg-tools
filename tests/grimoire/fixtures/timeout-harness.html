<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>engine timeout test harness</title>
    <style>
      #preview {
        width: 600px;
        height: 500px;
      }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <div id="preview"></div>
    <button id="print"></button>
    <button id="refresh"></button>
    <button id="download"></button>
    <input id="load" type="file" />
    <input id="auto-refresh" type="checkbox" checked />
    <div id="status" hidden></div>
    <script type="module">
      import { CoreViewer } from "@vivliostyle/core";

      import { startApp } from "/src/features/grimoire/app/start-app.ts";
      import { createEditor } from "/src/features/grimoire/adapters/editor.ts";
      import { downloadBook, loadBookFile } from "/src/features/grimoire/adapters/file.ts";
      import { paginate, PAGINATION_TIMEOUT_SECONDS } from "/src/features/grimoire/adapters/pagination.ts";
      import { printBook, PRINT_TIMEOUT_SECONDS } from "/src/features/grimoire/adapters/printing.ts";

      // A clock for the two bounds issue #10 adds, and for nothing else.
      //
      // They are 30 and 60 seconds, deliberately, so no test may sit through one.
      // Faking every timer in the page would fake the preview's 400ms debounce,
      // CodeMirror's own scheduling and Vivliostyle's layout time slices along with
      // them -- and the real engine has to keep running here, because what these
      // tests watch is a real repaint being restored and a real print starting fresh
      // afterwards. So only timers set for at least the shorter of the two bounds
      // are held back; everything else goes straight to the real clock, untouched.
      //
      // The threshold is derived from the bounds themselves rather than written out
      // again. A number copied from the source is a number that stops matching it:
      // lowering a bound below a hardcoded threshold would leave this holding
      // nothing back, and every test here would go on passing by waiting out a real
      // timer that fires within the poll window instead of proving the bound at all.
      //
      // Installed before `startApp` is called rather than before the modules load:
      // the adapters look `setTimeout` up on the global object at each call, and
      // module evaluation sets no timers.
      const SHORTEST_BOUND_MS = Math.min(PAGINATION_TIMEOUT_SECONDS, PRINT_TIMEOUT_SECONDS) * 1000;
      const realSetTimeout = window.setTimeout.bind(window);
      const realClearTimeout = window.clearTimeout.bind(window);
      const deadlines = new Map();
      // Negative, so `clearTimeout` can never mistake one of these for a real timer
      // id (the browser's own are positive).
      let nextDeadlineId = 0;

      window.setTimeout = (handler, delay, ...args) => {
        if (typeof handler === "function" && typeof delay === "number" && delay >= SHORTEST_BOUND_MS) {
          const id = --nextDeadlineId;
          deadlines.set(id, { remaining: delay, fire: () => handler(...args) });
          return id;
        }
        return realSetTimeout(handler, delay, ...args);
      };

      window.clearTimeout = (id) => {
        if (typeof id === "number" && id < 0) deadlines.delete(id);
        else realClearTimeout(id);
      };

      window.__advanceEngineClock = (ms) => {
        for (const [id, deadline] of [...deadlines]) {
          deadline.remaining -= ms;
          if (deadline.remaining <= 0) {
            deadlines.delete(id);
            deadline.fire();
          }
        }
      };

      window.__pendingEngineDeadlines = () => deadlines.size;

      // An engine that has been handed a book and says nothing back -- the failure
      // issue #10 is about, which has no document-level trigger at all (issue #11
      // established that Vivliostyle paginates even an empty string, and a document
      // it cannot fetch makes it *fail*, promptly, which is the opposite of this).
      // It is held one level down instead, at the single call that starts a run:
      // `loadDocument` is where both `paginate` and `printHTML` hand the engine its
      // document, so withholding that one call leaves a real CoreViewer sitting on a
      // real book with every real listener attached, having neither loaded nor
      // failed. Patching a prototype from a harness is what preview.e2e.ts
      // already does to `Element.prototype.replaceChildren`.
      const nativeLoadDocument = CoreViewer.prototype.loadDocument;
      let stalling = false;
      const stalled = [];
      const isolated = new URLSearchParams(location.search).has("isolated");
      const nativeRevokeObjectURL = URL.revokeObjectURL.bind(URL);

      // A timed-out adapter has correctly released its blob URL, but this fixture
      // deliberately resumes that abandoned run to observe the engine's late
      // completion. Retain only URLs revoked while an isolated run is stalled so
      // the resumed viewer still has a real document to load.
      if (isolated) {
        URL.revokeObjectURL = (url) => {
          if (!stalling) nativeRevokeObjectURL(url);
        };
      }

      CoreViewer.prototype.loadDocument = function (...args) {
        if (stalling) {
          const document =
            typeof args[0] === "string"
              ? fetch(args[0]).then((response) => response.text())
              : Promise.resolve(undefined);
          stalled.push({ viewer: this, args, document });
          return undefined;
        }
        return nativeLoadDocument.apply(this, args);
      };

      window.__stallEngine = () => {
        stalling = true;
      };
      window.__unstallEngine = () => {
        stalling = false;
      };
      window.__stalledEngineRuns = () => stalled.length;
      window.__oldestStalledEngineDocument = () =>
        stalled[0]?.document ?? Promise.resolve(undefined);

      // Lets the oldest withheld run finally reach the engine, unchanged: the book
      // loads for real and the run answers for real, only later than it should have.
      // Oldest rather than all, because a test that has two runs withheld at once is
      // asking what happens to the *abandoned* one while the newer one is still
      // waiting.
      window.__resumeOldestStalledEngineRun = () => {
        const run = stalled.shift();
        if (run) nativeLoadDocument.apply(run.viewer, run.args);
        return run !== undefined;
      };

      // Unlike the synchronous resume helper, this resolves only when the real
      // viewer reports that the abandoned document loaded successfully.
      window.__resumeOldestStalledEngineRunUntilLoaded = () => {
        const run = stalled.shift();
        if (!run) return Promise.resolve(false);

        return new Promise((resolve, reject) => {
          const cleanup = () => {
            run.viewer.removeListener("loaded", onLoaded);
            run.viewer.removeListener("error", onError);
          };
          const onLoaded = () => {
            cleanup();
            resolve(true);
          };
          const onError = (payload) => {
            cleanup();
            reject(new Error(`Late isolated load failed: ${JSON.stringify(payload.content)}`));
          };

          run.viewer.addListener("loaded", onLoaded);
          run.viewer.addListener("error", onError);
          try {
            nativeLoadDocument.apply(run.viewer, run.args);
          } catch (error) {
            cleanup();
            reject(error);
          }
        });
      };

      // The same, but answering with a failure: `loadDocument` with no URL is
      // CoreViewer's own "No URL specified" path, which dispatches the engine's real
      // 'error' event through the engine's own event target. That matters -- an
      // adapter that stopped listening when it gave up genuinely does not hear this,
      // where calling a captured handler directly would prove nothing.
      window.__failOldestStalledEngineRun = () => {
        const run = stalled.shift();
        if (run) nativeLoadDocument.call(run.viewer, undefined);
        return run !== undefined;
      };

      // `printHTML` appends one hidden iframe per print attempt it actually starts,
      // and removes it again once that attempt has run to the end. Counting them is
      // how a test sees whether a click started a print of its own or joined one
      // already in flight, which promise identity cannot show from outside the app.
      window.__printAttemptsStarted = () => document.querySelectorAll("iframe").length;

      // The print dialogue is the browser's own modal and has no result a test can
      // read -- headless Chromium makes `print()` a silent no-op, so an abandoned
      // attempt popping one over the author would leave no trace at all. Counting the
      // call is the only oracle there is for "a dialogue was opened", so each print
      // iframe's own `print` is replaced with a counter as it loads. The iframe's
      // element-level 'load' fires long before Vivliostyle finishes laying the book
      // out and calls back, so the counter is always in place in time.
      let printDialoguesOpened = 0;
      new MutationObserver((records) => {
        for (const record of records) {
          for (const node of record.addedNodes) {
            if (!(node instanceof HTMLIFrameElement)) continue;
            node.addEventListener("load", () => {
              if (node.contentWindow) node.contentWindow.print = () => (printDialoguesOpened += 1);
            });
          }
        }
      }).observe(document.body, { childList: true });
      window.__printDialoguesOpened = () => printDialoguesOpened;

      const editorContainer = document.getElementById("editor");
      const previewContainer = document.getElementById("preview");
      if (isolated) previewContainer.setAttribute("data-isolated", "");
      const printControl = document.getElementById("print");
      const refreshControl = document.getElementById("refresh");
      const autoRefreshControl = document.getElementById("auto-refresh");
      const statusContainer = document.getElementById("status");
      const downloadControl = document.getElementById("download");
      const loadControl = document.getElementById("load");
      const paginateAdapter = isolated
        ? (container, html) => paginate(container, html, { mode: "isolated" })
        : paginate;

      // The real pagination and printing adapters, at the seam issue #1's
      // architecture built for substitution -- not substituted here. Both bounds
      // live inside those adapters, because both guards they release do: nothing
      // above them can release printing's module-level single-flight guard, and
      // nothing above them knows what the preview held before the engine emptied
      // it. So these tests drive the real ones.
      const app = startApp(
        {
          editorContainer,
          previewContainer,
          printControl,
          refreshControl,
          autoRefreshControl,
          statusContainer,
          downloadControl,
          loadControl,
        },
        {
          editor: { create: createEditor },
          preview: { paginate: paginateAdapter },
          printing: { printBook },
          draft: { read: () => undefined, write: () => {}, flush: () => {}, destroy: () => {} },
          savedFile: { downloadBook, loadBookFile },
        },
      );

      window.__editor = app.editor;
    </script>
  </body>
</html>
