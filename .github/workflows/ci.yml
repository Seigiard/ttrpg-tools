name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test --parallel=1

      - name: Build
        run: bun run build

      - name: Check client bundle sizes
        run: bun run size:check

      - name: Paper minis browser tests
        run: bun run test:browser

  size-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The action checks out the base branch after measuring the PR. Keep the
      # tool and PR budgets outside the checkout, even if the base lacks them.
      - name: Prepare comparison tool
        run: |
          mkdir -p "$RUNNER_TEMP/size-limit"
          jq '{private: true, devDependencies: {"size-limit": .devDependencies["size-limit"], "@size-limit/file": .devDependencies["@size-limit/file"]}}' package.json > "$RUNNER_TEMP/size-limit/package.json"
          jq 'map(.path = (env.GITHUB_WORKSPACE + "/" + .path))' .size-limit.json > "$RUNNER_TEMP/size-limit/.size-limit.json"
          bun install --cwd "$RUNNER_TEMP/size-limit" --ignore-scripts

      - name: Report bundle size changes
        uses: andresz1/size-limit-action@v1.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: bun
          script: bun run --cwd "${{ runner.temp }}/size-limit" size-limit --json
